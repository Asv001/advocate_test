      - Задавать вопросы следователю, проводящему обыск, осмотр и выемку
      - Приносить свои возражения на действия следователя как в ходе производства следственных действий (обыска, выемки, осмотра), так и по его окончании в протоколе следственных действий
      - Общаться с адвокатом, в жилом или служебном помещении которого производится обыск, выемка, осмотр в целях определения защищаемых адвокатской тайной предметов и документов и недопущения их разглашения
      - Знакомиться с предметами, документами и сведениями, которые могут содержать адвокатскую тайну, до того как следователь ознакомится с ними, с целью отсеивания явно не относимых к предмету обыска (выемки, осмотру) и обеспечения конфиденциальности сведений, составляющих адвокатскую тайну, а также высказывать позицию по вопросу о возможности или невозможности их изъятия
      - Знакомиться с протоколом следственного действия и приносить на него свои замечания
      - Обжаловать действия (бездействие) и решения следователя, которые ограничили или сделали невозможным реализацию представителем адвокатской палаты своих функций по обеспечению неприкосновенности предметов и документов, составляющих адвокатскую тайну, а также в случаях, когда в нарушение законодательного запрета (ч. 2 ст. 450.1 УПК РФ) следователь допустил видео-, фото- и иную фиксацию материалов адвокатских производств в той их части, которая составляет адвокатскую тайну
